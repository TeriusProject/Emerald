name: ./app CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.8.0'
        cache-dependency-path: app/package-lock.json
        cache: 'npm'
    - run: npm install
    - run: CI=false npm run build
    - run: CI=false npm test
