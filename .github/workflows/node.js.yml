name: Node.js

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.8.0'
        cache-dependency-path: app/package-lock.json
        cache: 'npm'
    - name: Install dependencies
      run: npm install
    - name: Build
      run: CI=false npm run build
    - name: Run test
      run: CI=false npm test -- --passWithNoTests
